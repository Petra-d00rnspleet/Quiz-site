<!-- Herkent telefoon, tablet of laptop -->
<script>
(function () {
  var mq = window.matchMedia('(max-width: 700px), (pointer: coarse) and (max-width: 900px)');
  var aanraak = window.matchMedia('(pointer: coarse)');

  function zet() {
    var h = document.documentElement.classList;
    h.toggle('telefoon', mq.matches);
    h.toggle('breed', !mq.matches);
    h.toggle('tablet', !mq.matches && aanraak.matches);
  }

  zet();

  if (mq.addEventListener) {
    mq.addEventListener('change', zet);
  } else if (mq.addListener) {
    mq.addListener(zet);
  }
})();
</script>
