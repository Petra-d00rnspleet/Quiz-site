<script>

    // Herkent telefoon, tablet of laptop en zet de juiste indeling aan.
    (function () {
      var mq = window.matchMedia('(max-width: 700px), (pointer: coarse) and (max-width: 900px)');
      var aanraak = window.matchMedia('(pointer: coarse)');
      function zet() {
        var h = document.documentElement.classList;
        h.toggle('telefoon', mq.matches);       // telefoon: onderbalk + tegels
        h.toggle('breed', !mq.matches);         // laptop en tablet: zijbalk + tegels
        h.toggle('tablet', !mq.matches && aanraak.matches); // tablet: grotere knoppen
      }
      zet();
      if (mq.addEventListener) mq.addEventListener('change', zet); else if (mq.addListener) mq.addListener(zet);
    })();
  </script>
