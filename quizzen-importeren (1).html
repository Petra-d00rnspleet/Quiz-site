    keten = keten.then(function () {
      return db.ref('quizzen/' + q.code).set(bouwQuiz(q, nr + 1)).then(function () { log('✔ ' + q.titel + ' staat online', 'ok'); });
    }).catch(function (err) { log('✘ ' + q.titel + ': ' + (err && err.code ? err.code : err.message) + ' — probeer het als sitebeheer (ingelogd) opnieuw, of controleer de Firebase-regels.', 'fout'); });
  });
  keten.then(function () { log('Klaar. Kijk bij "Speelbare quizzen".'); knop.disabled = false; });
});
</script>
</body>
