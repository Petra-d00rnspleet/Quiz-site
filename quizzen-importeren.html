function prng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function omslag(q) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="' + q.kleur[0] + '"/><stop offset="100%" stop-color="' + q.kleur[1] + '"/></linearGradient></defs>' +
    '<rect width="480" height="270" fill="url(#g)"/><circle cx="70" cy="45" r="2" fill="#ffe9a8"/><circle cx="405" cy="38" r="2" fill="#ffe9a8"/><circle cx="425" cy="205" r="2" fill="#ffe9a8"/><circle cx="55" cy="185" r="1.5" fill="#ffe9a8"/>' +
    '<text x="240" y="150" font-size="96" text-anchor="middle">' + q.emoji + '</text>' +
    '<text x="240" y="225" font-size="30" font-weight="700" font-family="sans-serif" fill="#f0c04d" text-anchor="middle">' + q.titel + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function bouwQuiz(q, nr) {
  var vragen = q.vragen.map(function (v, i) {
    var goed = Array.isArray(v[1]) ? v[1] : [v[1]];
    var alle = goed.concat(v[2]);
    var rnd = prng(nr * 100 + i + 1);
    for (var k = alle.length - 1; k > 0; k--) { var j = Math.floor(rnd() * (k + 1)); var t = alle[k]; alle[k] = alle[j]; alle[j] = t; }
    var idx = goed.map(function (g) { return alle.indexOf(g) + 1; }).sort();
    var o = { vraag: v[0], antwoorden: alle, goedAntwoorden: idx, punten: 1000 };
    if (idx.length > 1) o.alleGoed = true;
    return o;
  });
  return { titel: q.titel, vragen: vragen, afbeelding: omslag(q), openbaar: true, publicatie: 'goedgekeurd',
    soloToegestaan: true, tijdslimiet: 20, geblokkeerd: false, makerNaam: 'Quizzzzz', makerUid: '', aangemaaktOp: Date.now() };
}

var lijstEl = document.getElementById('lijst'), logEl = document.getElementById('log'), knop = document.getElementById('knop');
QUIZZEN.forEach(function (q) { var li = document.createElement('li'); li.textContent = q.emoji + ' ' + q.titel + ' (' + q.vragen.length + ' vragen, code ' + q.code + ')'; lijstEl.appendChild(li); });
function log(t, klasse) { var d = document.createElement('div'); d.textContent = t; if (klasse) d.className = klasse; logEl.appendChild(d); }

knop.addEventListener('click', function () {
  knop.disabled = true; logEl.innerHTML = '';
  var keten = Promise.resolve();
  QUIZZEN.forEach(function (q, nr) {
    keten = keten.then(function () {
      return db.ref('quizzen/' + q.code).set(bouwQuiz(q, nr + 1)).then(function () { log('✔ ' + q.titel + ' staat online', 'ok'); });
    }).catch(function (err) { log('✘ ' + q.titel + ': ' + (err && err.code ? err.code : err.message) + ' — probeer het als sitebeheer (ingelogd) opnieuw, of controleer de Firebase-regels.', 'fout'); });
  });
  keten.then(function () { log('Klaar. Kijk bij "Speelbare quizzen".'); knop.disabled = false; });
});
